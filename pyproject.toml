[project]
name = "grid-tui"
version = "0.1.0"
description = "A terminal UI for Grid'5000"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=8.2", "httpx>=0.27", "pydantic>=2.7", "tzdata"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "textual-dev>=1.7", "ruff>=0.6", "isort>=5.13"]

[project.scripts]
grid-tui = "grid_tui.app:main"     # creates the `grid-tui` command

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grid_tui = ["*.tcss", "**/*.tcss"]  # ship the stylesheets with the package

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle (PEP 8), F: pyflakes, I: import order, N: PEP 8 naming
select = ["E", "W", "F", "I", "N"]

[tool.ruff.format]
quote-style = "single"

[tool.isort]
# sort imports the same way as Ruff's "I" rule, so the two always agree
profile = "black"
line_length = 88
src_paths = ["src", "tests"]
known_first_party = ["grid_tui", "tests"]
